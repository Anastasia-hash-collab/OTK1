<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Контроль качества ИОР в модуле. (Выключите VPN)</title>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F8FAFC; color: #0f172a; }

  header { background: #1E3A8A; color: white; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  .role-select { padding: 6px 10px; border-radius: 8px; border: none; background: white; color: #1E3A8A; font-weight: 600; }
  .role-badge { background: rgba(255,255,255,0.16); padding: 4px 10px; border-radius: 6px; font-size: 12px; }

  main { padding: 14px; max-width: 1200px; margin: 0 auto; }

  .tabs { display: flex; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid #E2E8F0; }
  .tab-button { padding: 8px 14px; border: none; background: transparent; cursor: pointer; font-size: 13px; font-weight: 600; color: #64748B; border-radius: 8px 8px 0 0; }
  .tab-button.active { background: white; color: #1E3A8A; box-shadow: 0 -1px 0 white; }
  .tab-content { display: none; }
  .tab-content.tab-active { display: block; }

  .card { background: white; border-radius: 16px; padding: 16px; box-shadow: 0 4px 18px rgba(15, 23, 42, 0.08); border: 1px solid #E2E8F0; }
  .card-header-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .card-title { display: flex; align-items: center; gap: 8px; }
  .card-title-icon { width: 22px; height: 22px; border-radius: 999px; background: #DBEAFE; display: flex; align-items: center; justify-content: center; color: #1D4ED8; font-size: 13px; }
  .card h2 { font-size: 17px; margin: 0; color: #1e3a8a; }

  .controls { display: flex; gap: 12px; flex-wrap: wrap; }
  label { font-size: 12px; font-weight: 500; color: #475569; display: block; margin-bottom: 2px; }
  select { padding: 6px 10px; border-radius: 8px; border: 1px solid #CBD5E1; background: white; color: #1E3A8A; font-weight: 600; min-width: 80px; }

  .info-row { margin: 4px 0 8px; font-size: 12px; color: #475569; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  .progress-wrap { display: flex; align-items: center; gap: 10px; }
  .progress-ring { width: 46px; height: 46px; }
  .progress-ring circle { fill: transparent; stroke-width: 5; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .progress-bg { stroke: #E5E7EB; }
  .progress-value { stroke: #3B82F6; stroke-linecap: round; stroke-dasharray: 0 999; stroke-dashoffset: 0; }
  .progress-label { font-size: 11px; color: #64748B; }

  .tasks { max-height: 60vh; overflow-y: auto; margin-top: 10px; border-top: 1px solid #E2E8F0; }
  .task-item { padding: 8px 4px; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; gap: 10px; }
  .task-num { width: 26px; text-align: right; font-size: 12px; color: #64748B; }
  .task-text { flex: 1; font-size: 13px; color: #0f172a; }
  .task-checkbox { display: flex; gap: 4px; align-items: center; color: #475569; font-size: 12px; white-space: nowrap; }
  .task-checkbox input { width: 16px; height: 16px; }
  .task-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 140px; }
  .task-comment-input { width: 160px; max-width: 50vw; padding: 3px 6px; font-size: 11px; border-radius: 6px; border: 1px solid #CBD5E1; }
  .task-user-select { width: 160px; max-width: 50vw; padding: 3px 6px; font-size: 11px; border-radius: 6px; border: 1px solid #CBD5E1; background: #FFFFFF; }
  @media (max-width: 480px) { .task-user-select { width: 100%; max-width: 100%; } }

  .footer-status { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #E2E8F0; font-size: 13px; gap: 10px; flex-wrap: wrap; }

  .badge { padding: 6px 12px; border-radius: 10px; font-weight: 600; font-size: 12px; }
  .badge-ready { background: #DCFCE7; color: #166534; }
  .badge-not-ready { background: #FEE2E2; color: #B91C1C; }
  .badge-inprogress { background: #DBEAFE; color: #1D4ED8; }

  button { padding: 6px 12px; background: #3B82F6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; }
  button:hover { background: #2563EB; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .summary-header-row { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 6px; gap: 8px; flex-wrap: wrap; }
  .summary-header-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { padding: 4px 10px; border-radius: 999px; background: #DBEAFE; color: #1E3A8A; font-size: 12px; font-weight: 600; }

  .summary-table-wrapper { width: 100%; overflow-x: auto; }
  .summary-table { width: 100%; border-collapse: collapse; margin-top: 4px; min-width: 360px; }
  .summary-table th { background: #EFF6FF; font-size: 11px; padding: 6px 8px; text-transform: uppercase; border-bottom: 2px solid #BFDBFE; color: #1e3a8a; }
  .summary-table td { padding: 6px 8px; border-bottom: 1px solid #E2E8F0; font-size: 12px; }
  .row-ready { background: #ECFDF5; }
  .percent-cell { font-variant-numeric: tabular-nums; }
  #floorFilterSelect { padding: 4px 8px; border-radius: 8px; border: 1px solid #CBD5E1; background: white; color: #1E3A8A; font-size: 11px; font-weight: 500; }
  .percent-colored { font-weight: 600; color: white; padding: 4px 8px; border-radius: 6px; text-align: center; min-width: 55px; display: inline-block; }

  @media (max-width: 600px) {
    header { flex-direction: column; align-items: flex-start; }
    .role-bar { align-self: flex-end; }
  }
</style>
</head>

        <div style="display:flex; gap:6px; flex-wrap:wrap;">

          <button id="resetModule">Сбросить все</button>

      </div>

  <!-- TAB: SECTION -->
  <div class="tab-content" id="tab-section">
    <section class="card">
      <div class="card-header-row">

          <div class="card-title-icon">📊</div>
          <h2>Сводная по секции</h2>
        </div>
        <div class="progress-wrap">
          <svg class="progress-ring" viewBox="0 0 40 40">
            <circle class="progress-bg" cx="20" cy="20" r="16"></circle>

          <div>
            <div id="sectionPercentQA">Принято ОТК: 0%</div>
            <div class="progress-label">Вся секция</div>
          </div>
        </div>
      </div>

      <div class="footer-status">
        <span id="sectionStatusBadge" class="badge badge-not-ready">Секция не начата</span>
        <button id="exportCsv">Экспорт CSV</button>
      </div>

      <div class="summary-header-row">
        <div class="summary-header-left">
          <strong>Модули</strong>
          <select id="floorFilterSelect"></select>
        </div>
        <span id="summaryReadyCount" class="tag">Готово: 0</span>
      </div>

      <div class="summary-table-wrapper">
        <table class="summary-table">
          <thead>
          <tr>
            <th>Модуль</th>
            <th>Этаж</th>
            <th>%</th>
            <th>Статус</th>

          </thead>
          <tbody id="summaryTableBody"></tbody>

      </div>
    </section>
  </div>
</main>

  const TASKS_STANDARD = [

  ];

  const TASKS_ADJ_LLU = [
    "Потолок из металлического профиля, зашитый цементно-перлитовыми плитами с проклейкой стыков лентой Герлен. Крепление потолка на анкерах.",
    "Установка распределительных коробок, подрозетников и прокладка кабеля с расключением.",
    "Установка гильз-пакетов ЭОМ в местах общего пользования (МОП).",
    "Монтаж стояков отопления.",
    "Установка радиаторов.",
    "Монтаж металлического каркаса зашивки инженерных коммуникаций МОП.",
    "Устройство противопожарных отсечек инженерных коммуникаций МОП.",
    "Установка оконных и дверных блоков из алюминия и ПВХ с монтажом стеклопакетов, фурнитуры и герметизацией швов.",
    "Монтаж подоконников, устройство и покраска откосов.",
    "Укладка плитки балкона с последующей затиркой.",
    "Устройство мокрого штукатурного фасада балкона.",
    "Монтаж кронштейнов подсистемы НВФ.",
    "Монтаж утеплителя по фасаду модуля.",
    "Монтаж противопожарной отсечки СПК."
  ];

  const TASKS_LLU = [
    "Монтаж металлического каркаса зашивки инженерных коммуникаций МОП.",
    "Монтаж стояков отопления.",
    "Установка радиаторов.",
    "Монтаж систем ДВ, ДП.",
    "Монтаж дверей ЛЛУ.",
    "Установка оконных блоков с монтажом стеклопакетов и зачеканкой швов.",
    "Укладка плитки ЛЛУ.",
    "Монтаж кронштейнов подсистемы НВФ.",
    "Монтаж утеплителя по фасаду модуля.",
    "Монтаж противопожарной отсечки СПК."
  ];

  const GROUP_NAMES = ["Все", "СТК", "ВИС", "ЭОМ", "Потолки", "Фасад", "Отделка"];
  const GROUP_INDICES = {
    "СТК":      [2, 3],
    "ВИС":      [8, 9, 10, 11, 12, 13, 14, 15],
    "ЭОМ":      [5, 6, 7],
    "Потолки":  [4],
    "Фасад":    [22, 23, 24],
    "Отделка":  [1, 16, 17, 18, 19, 20, 21]
  };

  function getModuleNumber(moduleId) { return parseInt(moduleId.replace("M",""), 10) || 1; }
  function getFloor(moduleId) { const num = getModuleNumber(moduleId); return FLOOR_START + Math.floor((num - 1) / MODULES_PER_FLOOR); }
  function getPositionOnFloor(moduleId) { const num = getModuleNumber(moduleId); return ((num - 1) % MODULES_PER_FLOOR) + 1; }

  function getModuleType(moduleId) {
    const pos = getPositionOnFloor(moduleId);
    if (pos === ADJ_LLU_POS) return "adj_llu";
    if (pos === LLU_POS) return "llu";
    return "standard";
  }

  function getTasksForModule(moduleId) {
    const type = getModuleType(moduleId);
    if (type === "adj_llu") return TASKS_ADJ_LLU;
    if (type === "llu") return TASKS_LLU;
    return TASKS_STANDARD;
  }

  function getVisibleTaskIndices(moduleId) {
    const type = getModuleType(moduleId);
    if (type !== "standard") {
      const len = getTasksForModule(moduleId).length;
      return Array.from({ length: len }, (_, i) => i);
    }
    if (currentGroup === "Все") return Array.from({ length: TASKS_STANDARD.length }, (_, i) => i);
    const nums = GROUP_INDICES[currentGroup] || [];
    return nums.map(n => n - 1).filter(i => i >= 0 && i < TASKS_STANDARD.length);
  }

  // ---------- STATE ----------
  let modulesData = {};
  let currentModuleId = "M1";
  let currentRole = "viewer";
  let currentGroup = "Все";
  let currentFloorFilter = "all";
  const authenticatedRoles = { otk: false, chief: false };
  const loadedModules = new Set();

  function ensureModuleArraysSize(moduleId) {
    const tasks = getTasksForModule(moduleId);
    const len = tasks.length;

    if (!modulesData[moduleId]) {
      modulesData[moduleId] = { qaTasks: Array(len).fill(false), comments: Array(len).fill(""), qaUsers: Array(len).fill("") };
      return;
    }

    const m = modulesData[moduleId];
    if (!Array.isArray(m.qaTasks)) m.qaTasks = [];
    if (!Array.isArray(m.comments)) m.comments = [];
    if (!Array.isArray(m.qaUsers)) m.qaUsers = [];

    const newQA = Array(len).fill(false);
    const newComments = Array(len).fill("");
    const newQaUsers = Array(len).fill("");

    const copyLen = Math.min(len, m.qaTasks.length, m.comments.length || len, m.qaUsers.length || len);
    for (let i = 0; i < copyLen; i++) {
      newQA[i] = !!m.qaTasks[i];
      newComments[i] = m.comments[i] || "";
      newQaUsers[i] = m.qaUsers[i] || "";
    }

    m.qaTasks = newQA;
    m.comments = newComments;
    m.qaUsers = newQaUsers;
  }

  function initModulesData() {
    for (let i = 1; i <= TOTAL_MODULES; i++) ensureModuleArraysSize("M" + i);
  }

  function calculatePercent(arr) {
    if (!Array.isArray(arr) || arr.length === 0) return 0;
    const done = arr.filter(Boolean).length;
    return Math.round((done / arr.length) * 100);
  }

  function updateProgressCircle(circleId, percent) {
    const circle = document.getElementById(circleId);
    if (!circle) return;
    const radius = circle.r.baseVal.value;
    const circumference = 2 * Math.PI * radius;
    circle.style.strokeDasharray = `${circumference} ${circumference}`;
    circle.style.strokeDashoffset = circumference - (percent / 100) * circumference;
  }

  function statusByPercent(p) {
    if (p === 0) return "Не начато (0%)";
    if (p === 100) return "Готово к отгрузке (100%)";
    return "В работе (1–99%)";
  }

  function badgeClassByPercent(baseClass, p) {
    if (p === 0) return baseClass + " badge-not-ready";
    if (p === 100) return baseClass + " badge-ready";
    return baseClass + " badge-inprogress";
  }

  function updateModuleTypeHint() {
    const hint = document.getElementById("moduleTypeHint");
    const type = getModuleType(currentModuleId);
    if (type === "standard") hint.textContent = "Типовой модуль";
    else if (type === "adj_llu") hint.textContent = "Смежный модуль с ЛЛУ (4-й)";
    else hint.textContent = "Модуль ЛЛУ (5-й)";
  }

  function updateModuleFloorInfo() {
    document.getElementById("moduleFloorInfo").textContent = "Этаж: " + getFloor(currentModuleId);
  }

  function updateGroupUIForModule() {
    const select = document.getElementById("groupSelect");
    if (!select) return;
    select.disabled = (getModuleType(currentModuleId) !== "standard");
  }

  function updateModuleStats() {
    ensureModuleArraysSize(currentModuleId);
    const moduleData = modulesData[currentModuleId];
    const qaPercent = calculatePercent(moduleData.qaTasks);

    document.getElementById("percentQA").textContent = "Принято ОТК: " + qaPercent + "%";

    const badgeEl = document.getElementById("statusBadge");
    badgeEl.textContent = statusByPercent(qaPercent);
    badgeEl.className = badgeClassByPercent("badge", qaPercent);

    updateProgressCircle("moduleProgressCircle", qaPercent);
  }

  function updateRoleUI() {
    document.getElementById("roleBadge").textContent = ROLE_LABELS[currentRole] || "";
    const resetBtn = document.getElementById("resetModule");
    if (resetBtn) resetBtn.disabled = (currentRole !== "chief");
    renderTasks();
  }

  function setRole(role) {
    currentRole = role;
    document.getElementById("roleSelect").value = role;
    updateRoleUI();
  }

  function handleRoleChange(e) {
    const newRole = e.target.value;
    if (newRole === "viewer") return setRole("viewer");
    if (authenticatedRoles[newRole]) return setRole(newRole);

    const pwd = prompt("Введите пароль для ОТК:");
    if (pwd === ROLE_PASSWORDS[newRole]) {
      authenticatedRoles[newRole] = true;
      setRole(newRole);
    } else {
      alert("Неверный пароль");
      e.target.value = currentRole;
    }
  }

  function populateModuleSelect() {
    const select = document.getElementById("moduleSelect");
    select.innerHTML = "";
    for (let i = 1; i <= TOTAL_MODULES; i++) {
      const id = "M" + i;
      const type = getModuleType(id);
      const label = type === "standard" ? "" : (type === "adj_llu" ? " (4-й, смежн.)" : " (5-й, ЛЛУ)");
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = id + label;
      select.appendChild(opt);
    }
    select.value = currentModuleId;
  }

  function populateGroupSelect() {
    const select = document.getElementById("groupSelect");
    select.innerHTML = "";
    GROUP_NAMES.forEach((name) => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });
    select.value = currentGroup;
  }

  function populateFloorFilter() {
    const select = document.getElementById("floorFilterSelect");
    if (!select) return;
    select.innerHTML = "";

    const optAll = document.createElement("option");
    optAll.value = "all";
    optAll.textContent = "Все этажи";
    select.appendChild(optAll);

    for (let floor = FLOOR_START; floor <= FLOOR_END; floor++) {
      const opt = document.createElement("option");
      opt.value = String(floor);
      opt.textContent = floor + " этаж";
      select.appendChild(opt);
    }
    select.value = currentFloorFilter;
  }

  function getColorForPercent(p) {
    const r1 = 220, g1 = 38,  b1 = 38;
    const r2 = 255, g2 = 165, b2 = 0;
    const r3 = 22,  g3 = 163, b3 = 74;

    let r, g, b;
    if (p < 50) {
      const t = p / 50;
      r = r1 + (r2 - r1) * t;
      g = g1 + (g2 - g1) * t;
      b = b1 + (b2 - b1) * t;
    } else {
      const t = (p - 50) / 50;
      r = r2 + (r3 - r2) * t;
      g = g2 + (g3 - g2) * t;
      b = b2 + (b3 - b2) * t;
    }
    return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
  }

  // ---------- Firestore ----------
  async function loadModuleFromFirestore(moduleId) {
    ensureModuleArraysSize(moduleId);
    try {
      const snap = await moduleRef(moduleId).get();
      if (snap.exists) {
        const data = snap.data() || {};
        modulesData[moduleId] = {
          qaTasks: Array.isArray(data.qaTasks) ? data.qaTasks : modulesData[moduleId].qaTasks,
          comments: Array.isArray(data.comments) ? data.comments : modulesData[moduleId].comments,
          qaUsers: Array.isArray(data.qaUsers) ? data.qaUsers : modulesData[moduleId].qaUsers
        };
        ensureModuleArraysSize(moduleId);
      }
      loadedModules.add(moduleId);
    } catch (e) {
      console.warn("Не удалось загрузить модуль из Firestore:", moduleId, e);
    }
  }

  async function loadSummaryFromFirestore() {
    try {
      const snap = await summaryRef.get();
      if (snap.exists) {
        const data = snap.data() || {};
        summariesData = (data.modules && typeof data.modules === "object") ? data.modules : {};
      } else {
        summariesData = {};
      }
    } catch (e) {
      console.warn("Не удалось загрузить summary из Firestore:", e);
      summariesData = {};
    }
  }

  let saveTimer = null;
  function saveToFirestore() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        const moduleId = currentModuleId;
        const m = modulesData[moduleId];

        // 1) сохраняем модуль
        await moduleRef(moduleId).set(
          {
            qaTasks: m.qaTasks,
            comments: m.comments,
            qaUsers: m.qaUsers,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          },
          { merge: true }
        );

        // 2) обновляем сводную (только для этого модуля) в одном документе
        const qaPercent = calculatePercent(m.qaTasks);
        const floor = getFloor(moduleId);
        const status = statusByPercent(qaPercent);
        const ready = (qaPercent === 100);

        // локальный кэш
        summariesData[moduleId] = { qaPercent, floor, status, ready };

        const fieldPath = `modules.${moduleId}`;
        await summaryRef.set(
          {
            [fieldPath]: {
              qaPercent,
              floor,
              status,
              ready,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }
          },
          { merge: true }
        );
      } catch (e) {
        console.warn("Не удалось сохранить в Firestore:", currentModuleId, e);
      }
    }, 250);
  }

  // ---------- UI ----------
  function renderTasks() {
    ensureModuleArraysSize(currentModuleId);

    const container = document.getElementById("tasksContainer");
    container.innerHTML = "";

    updateModuleTypeHint();
    updateModuleFloorInfo();
    updateGroupUIForModule();

    const moduleData = modulesData[currentModuleId];
    const tasks = getTasksForModule(currentModuleId);
    const indices = getVisibleTaskIndices(currentModuleId);

    indices.forEach((taskIndex) => {
      const item = document.createElement("div");
      item.className = "task-item";

      const num = document.createElement("div");
      num.className = "task-num";
      num.textContent = taskIndex + 1;

      const labelDiv = document.createElement("div");
      labelDiv.className = "task-text";
      labelDiv.textContent = tasks[taskIndex];

      const qaWrapper = document.createElement("label");
      qaWrapper.className = "task-checkbox";

      const qaCheckbox = document.createElement("input");
      qaCheckbox.type = "checkbox";
      qaCheckbox.checked = moduleData.qaTasks[taskIndex];
      qaCheckbox.disabled = (currentRole === "viewer");

      const userSelect = document.createElement("select");
      userSelect.className = "task-user-select";

      const emptyOpt = document.createElement("option");
      emptyOpt.value = "";
      emptyOpt.textContent = "- фамилия ОТК -";
      userSelect.appendChild(emptyOpt);

      OTK_USERS.forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        userSelect.appendChild(opt);
      });

      userSelect.value = moduleData.qaUsers[taskIndex] || "";
      userSelect.disabled = (currentRole === "viewer") || !moduleData.qaTasks[taskIndex];

      userSelect.addEventListener("change", () => {
        if (currentRole === "viewer") {
          userSelect.value = moduleData.qaUsers[taskIndex] || "";
          return;
        }
        moduleData.qaUsers[taskIndex] = userSelect.value || "";
        saveToFirestore();
      });

      const commentInput = document.createElement("input");
      commentInput.type = "text";
      commentInput.className = "task-comment-input";
      commentInput.placeholder = "Комментарий";
      commentInput.value = moduleData.comments[taskIndex] || "";
      commentInput.disabled = (currentRole === "viewer");

      commentInput.addEventListener("change", () => {
        if (currentRole === "viewer") {
          commentInput.value = moduleData.comments[taskIndex] || "";
          return;
        }
        moduleData.comments[taskIndex] = commentInput.value;
        saveToFirestore();
      });

      qaCheckbox.addEventListener("change", () => {
        if (currentRole === "viewer") {
          qaCheckbox.checked = moduleData.qaTasks[taskIndex];
          return;
        }

        const prev = moduleData.qaTasks[taskIndex];
        const next = qaCheckbox.checked;
        const saved = moduleData.qaUsers[taskIndex] || "";

        if (saved && prev && !next && currentRole !== "chief") {
          alert("Снять галочку может только руководитель ОТК, если назначена фамилия.");
          qaCheckbox.checked = true;
          return;
        }

        if (!prev && next) {
          if (currentRole === "otk" || currentRole === "chief") {
            moduleData.qaTasks[taskIndex] = true;
            userSelect.disabled = false;
            if (!moduleData.qaUsers[taskIndex]) {
              const def = OTK_USERS[0] || "";
              moduleData.qaUsers[taskIndex] = def;
              userSelect.value = def;
            }
          } else {
            qaCheckbox.checked = prev;
          }
        } else if (prev && !next) {
          if (currentRole === "chief") {
            moduleData.qaTasks[taskIndex] = false;
            moduleData.qaUsers[taskIndex] = "";
            userSelect.value = "";
            userSelect.disabled = true;
          } else {
            alert("Снять галочку может только руководитель ОТК.");
            qaCheckbox.checked = true;
          }
        }

        updateModuleStats();
        updateSummaryTable(); // сводная обновится локально (по summariesData)
        saveToFirestore();
      });

      qaWrapper.appendChild(qaCheckbox);
      qaWrapper.appendChild(document.createTextNode("ОТК"));

      const rightCol = document.createElement("div");
      rightCol.className = "task-right";
      rightCol.appendChild(qaWrapper);
      rightCol.appendChild(userSelect);
      rightCol.appendChild(commentInput);

      item.appendChild(num);
      item.appendChild(labelDiv);
      item.appendChild(rightCol);
      container.appendChild(item);
    });

    updateModuleStats();
  }

  function updateSummaryTable() {
    const tbody = document.getElementById("summaryTableBody");
    tbody.innerHTML = "";

    let readyCountAll = 0;
    let sumQAAll = 0;

    for (let i = 1; i <= TOTAL_MODULES; i++) {
      const id = "M" + i;

      const s = summariesData[id] || {};
      const qaPercent = Number.isFinite(s.qaPercent) ? s.qaPercent : 0;

      const floor = getFloor(id);
      const ready = (qaPercent === 100);

      sumQAAll += qaPercent;
      if (ready) readyCountAll++;

      if (currentFloorFilter !== "all" && floor !== Number(currentFloorFilter)) continue;

      const tr = document.createElement("tr");
      if (ready) tr.classList.add("row-ready");

      const tdModule = document.createElement("td");
      tdModule.textContent = id;

      const tdFloor = document.createElement("td");
      tdFloor.textContent = floor;

      const tdQA = document.createElement("td");
      tdQA.className = "percent-cell";
      const colorSpan = document.createElement("span");
      colorSpan.className = "percent-colored";
      colorSpan.textContent = qaPercent + "%";
      colorSpan.style.backgroundColor = getColorForPercent(qaPercent);
      tdQA.appendChild(colorSpan);

      const tdStatus = document.createElement("td");
      tdStatus.textContent = statusByPercent(qaPercent);

      tr.appendChild(tdModule);
      tr.appendChild(tdFloor);
      tr.appendChild(tdQA);
      tr.appendChild(tdStatus);
      tbody.appendChild(tr);
    }

    const sectionQA = Math.round(sumQAAll / TOTAL_MODULES);
    document.getElementById("sectionPercentQA").textContent = "Принято ОТК: " + sectionQA + "%";

    const sectionStatusBadge = document.getElementById("sectionStatusBadge");
    sectionStatusBadge.textContent =
      sectionQA === 0 ? "Секция не начата" :
      sectionQA === 100 ? "Секция готова к отгрузке" :
      "Секция в работе";
    sectionStatusBadge.className = badgeClassByPercent("badge", sectionQA);

    document.getElementById("summaryReadyCount").textContent = "Готово: " + readyCountAll;
    updateProgressCircle("sectionProgressCircle", sectionQA);
  }

  function exportSummaryToCsv() {
    let rows = [];
    rows.push(["Модуль", "Этаж", "% ОТК", "Статус"]);

    for (let i = 1; i <= TOTAL_MODULES; i++) {
      const id = "M" + i;
      const qaPercent = Number.isFinite(summariesData[id]?.qaPercent) ? summariesData[id].qaPercent : 0;
      const floor = getFloor(id);
      rows.push([id, String(floor), qaPercent + "%", statusByPercent(qaPercent)]);
    }

    const csvContent = rows
      .map((row) => row.map((f) => `"${String(f).replace(/"/g, '""')}"`).join(";"))
      .join("\r\n");

    const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "svodka_section3.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportModuleChecklistToCsv() {
    const moduleId = currentModuleId;
    const floor = getFloor(moduleId);
    ensureModuleArraysSize(moduleId);

    const tasks = getTasksForModule(moduleId);
    const moduleData = modulesData[moduleId];

    let rows = [];
    rows.push(["Модуль", "Этаж", "№", "Вид работ", "Принято ОТК", "Комментарий", "Фамилия ОТК"]);

    tasks.forEach((taskText, index) => {
      rows.push([
        moduleId,
        String(floor),
        String(index + 1),
        taskText,
        moduleData.qaTasks[index] ? "Да" : "Нет",
        moduleData.comments?.[index] || "",
        moduleData.qaUsers?.[index] || ""
      ]);
    });

    const csvContent = rows
      .map((row) => row.map((f) => `"${String(f).replace(/"/g, '""')}"`).join(";"))
      .join("\r\n");

    const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `checklist_section3_${moduleId}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function resetCurrentModule() {
    if (currentRole !== "chief") {
      alert("Сбросить все отметки может только руководитель ОТК.");
      return;
    }
    const tasks = getTasksForModule(currentModuleId);
    const len = tasks.length;
    modulesData[currentModuleId].qaTasks = Array(len).fill(false);
    modulesData[currentModuleId].comments = Array(len).fill("");
    modulesData[currentModuleId].qaUsers = Array(len).fill("");
    renderTasks();
    updateSummaryTable();
    saveToFirestore();
  }

  function initTabs() {
  const buttons = document.querySelectorAll(".tab-button");
  const contents = document.querySelectorAll(".tab-content");

  buttons.forEach((btn) => {
    btn.addEventListener("click", async () => {
      const tab = btn.getAttribute("data-tab");

      buttons.forEach((b) => b.classList.remove("active"));
      contents.forEach((c) => c.classList.remove("tab-active"));

      btn.classList.add("active");
      document.getElementById("tab-" + tab).classList.add("tab-active");

      if (tab === "section") {
        // ⬇️ ВАЖНО: ждём Firestore, потом рисуем
        await loadSummaryFromFirestore();
        updateSummaryTable();
      }
    });
  });
}

document.addEventListener("DOMContentLoaded", async () => {
  initTabs();
  initModulesData();

  // 1) загружаем текущий модуль
  await loadModuleFromFirestore(currentModuleId);

  // 2) загружаем сводную ОДИН раз и рисуем
  await loadSummaryFromFirestore();

  populateModuleSelect();
  populateGroupSelect();
  populateFloorFilter();

  renderTasks();
  updateSummaryTable();
  updateRoleUI();

  document.getElementById("moduleSelect").addEventListener("change", async (e) => {
    currentModuleId = e.target.value;
    if (!loadedModules.has(currentModuleId)) await loadModuleFromFirestore(currentModuleId);
    renderTasks();

    // ⚠️ тут лучше НЕ перерисовывать сводную, она берётся из summariesData
    // updateSummaryTable();
  });

  document.getElementById("groupSelect").addEventListener("change", (e) => {
    currentGroup = e.target.value;
    renderTasks();
  });

  document.getElementById("floorFilterSelect").addEventListener("change", (e) => {
    currentFloorFilter = e.target.value;
    updateSummaryTable();
  });

  document.getElementById("resetModule").addEventListener("click", resetCurrentModule);

  document.getElementById("roleSelect").addEventListener("change", handleRoleChange);
  document.getElementById("exportCsv").addEventListener("click", exportSummaryToCsv);
  document.getElementById("exportModuleCsv").addEventListener("click", exportModuleChecklistToCsv);
});
</script>
